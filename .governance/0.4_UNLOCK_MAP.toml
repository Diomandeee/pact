# UNLOCK MAP
#
# Every file PACT is expected to contain, and what must be true before it
# opens. The whole map is visible; most of it is locked.
#
# A locked file is NOT a stub. A stub claims to work and turns a red gate
# green. A locked file declares it is closed, keeps the gate red, and states
# the reason. That distinction is the entire mechanism.
#
#   ./scripts/pz status     what is open, what is next, what is far and why
#   ./scripts/pz scaffold   create every locked file
#   ./scripts/pz check      nothing was edited while locked
#   ./scripts/pz open <p>   unlock a file whose gates have passed
#
# Gate ids refer to .governance/0.3_LIVING_CHECKLIST.md. Unlocking happens by
# ticking a gate there, and a gate is ticked because its command passed.

