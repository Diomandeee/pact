[workspace]
resolver = "2"
members = ["crates/pact-core", "crates/pact-algebra", "crates/pact-corpus", "crates/pact-analysis", "crates/pact-cli", "crates/pact-server", "crates/pact-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
publish = false
repository = "https://github.com/Diomandeee/pact"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
